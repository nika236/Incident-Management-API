services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incident_management
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=incident_management;Username=incident;Password=incident
      JWT_SIGNING_KEY: docker_dev_signing_key_change_in_production_32chars
      Swagger__Enabled: "true"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
